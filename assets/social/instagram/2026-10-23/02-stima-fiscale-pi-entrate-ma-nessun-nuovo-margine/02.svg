<text x="70" y="370" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900" letter-spacing="-2"><tspan x="70" dy="0">STIMA FISCALE: PIÙ</tspan><tspan x="70" dy="44">ENTRATE, MA NESSUN NUOVO</tspan><tspan x="70" dy="44">MARGINE</tspan></text>
<rect x="70" y="500" width="760" height="2" fill="#FF4F87"/>
<text x="70" y="560" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" letter-spacing="-.35"><tspan x="70" dy="0">La previsione fiscale per il 2027 indica per</tspan><tspan x="70" dy="39">il Bund circa quattro miliardi di euro di</tspan><tspan x="70" dy="39">entrate in più rispetto alle attese</tspan><tspan x="70" dy="39">precedenti, ma il ministro delle Finanze Lars</tspan><tspan x="70" dy="39">Klingbeil esclude che ciò apra</tspan><tspan x="70" dy="39">automaticamente nuovi spazi di bilancio.</tspan><tspan x="70" dy="39">Tagesschau riferisce che le crisi attuali</tspan><tspan x="70" dy="39">continuano a pesare sui conti, mentre</tspan><tspan x="70" dy="39">Handelsblatt descrive l’assenza di un</tspan><tspan x="70" dy="39">inatteso “tesoretto” per la coalizione. La</tspan><tspan x="70" dy="39">questione condiziona gli sgravi energetici</tspan><tspan x="70" dy="39">chiesti dai Länder e le priorità di spesa</tspan><tspan x="70" dy="39">federali; il passaggio aperto è la traduzione</tspan><tspan x="70" dy="39">della stima nella manovra.</tspan></text><rect x="70" y="1080" width="211" height="8" fill="#FF4F87"/><rect x="281" y="1080" width="205" height="8" fill="#7C4DFF"/><rect x="486" y="1080" width="204" height="8" fill="#FFDE02"/></svg>