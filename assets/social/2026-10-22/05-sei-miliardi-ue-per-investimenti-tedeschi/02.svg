<rect x="70" y="1160" width="940" height="1" fill="#4E3976"/><text x="70" y="1220" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="-.35"><tspan x="70" dy="0">unminuto.news/2026/10/22/briefing-del-22-ottobre/</tspan></text><text x="1010" y="510" text-anchor="end" fill="#F1E8F5" opacity=".82" font-family="Arial, Helvetica, sans-serif" font-size="340" font-weight="900" letter-spacing="-25"><tspan x="1010" dy="0">02</tspan></text>
<text x="70" y="370" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900" letter-spacing="-2"><tspan x="70" dy="0">SEI MILIARDI UE PER</tspan><tspan x="70" dy="44">INVESTIMENTI TEDESCHI</tspan></text>
<rect x="70" y="500" width="760" height="2" fill="#FF4F87"/>
<text x="70" y="560" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" letter-spacing="-.35"><tspan x="70" dy="0">La Commissione europea ha approvato una</tspan><tspan x="70" dy="39">tranche da sei miliardi di euro per la</tspan><tspan x="70" dy="39">Germania dal fondo di ripresa, riferisce</tspan><tspan x="70" dy="39">Handelsblatt . Le risorse sono destinate, tra</tspan><tspan x="70" dy="39">l&#x27;altro, a ristrutturazioni energetiche,</tspan><tspan x="70" dy="39">veicoli e colonnine di ricarica, oltre alla</tspan><tspan x="70" dy="39">digitalizzazione di ospedali: un legame</tspan><tspan x="70" dy="39">diretto con gli investimenti pubblici</tspan><tspan x="70" dy="39">tedeschi. Prima dell&#x27;erogazione serve ancora</tspan><tspan x="70" dy="39">il passaggio nel Consiglio; l&#x27;attuazione</tspan><tspan x="70" dy="39">concreta dei progetti sarà la verifica</tspan><tspan x="70" dy="39">sostanziale.</tspan></text><rect x="70" y="1080" width="211" height="8" fill="#FF4F87"/><rect x="281" y="1080" width="205" height="8" fill="#7C4DFF"/><rect x="486" y="1080" width="204" height="8" fill="#FFDE02"/></svg>