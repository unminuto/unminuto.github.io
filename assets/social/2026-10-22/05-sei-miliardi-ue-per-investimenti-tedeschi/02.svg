<text x="70" y="232" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5"><tspan x="70" dy="0">LA NOTIZIA</tspan></text>
