<text x="70" y="370" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900" letter-spacing="-2"><tspan x="70" dy="0">ALLARME PHP: SITI</tspan><tspan x="70" dy="44">PUBBLICI E PRIVATI</tspan><tspan x="70" dy="44">ESPOSTI</tspan></text>
<rect x="70" y="500" width="760" height="2" fill="#FF4F87"/>
<text x="70" y="560" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" letter-spacing="-.35"><tspan x="70" dy="0">Una vulnerabilità critica di PHP sta causando</tspan><tspan x="70" dy="39">indisponibilità e misure d&#x27;emergenza su siti</tspan><tspan x="70" dy="39">web; Tagesschau , Deutschlandfunk , FAZ e</tspan><tspan x="70" dy="39">Handelsblatt riportano l&#x27;allerta. Per la</tspan><tspan x="70" dy="39">Germania il punto è operativo:</tspan><tspan x="70" dy="39">amministrazioni, ospedali e imprese dipendono</tspan><tspan x="70" dy="39">da infrastrutture web che possono richiedere</tspan><tspan x="70" dy="39">aggiornamenti e verifiche rapide. Il BSI</tspan><tspan x="70" dy="39">raccomanda l&#x27;installazione tempestiva</tspan><tspan x="70" dy="39">dell&#x27;aggiornamento; l&#x27;ampiezza effettiva</tspan><tspan x="70" dy="39">delle interruzioni resta da quantificare.</tspan></text><rect x="70" y="1080" width="211" height="8" fill="#FF4F87"/><rect x="281" y="1080" width="205" height="8" fill="#7C4DFF"/><rect x="486" y="1080" width="204" height="8" fill="#FFDE02"/></svg>