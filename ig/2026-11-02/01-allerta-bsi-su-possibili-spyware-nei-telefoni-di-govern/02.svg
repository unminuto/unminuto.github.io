<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/11/02/briefing-del-02-novembre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il Bundesamt für Sicherheit in der</tspan><tspan x="64" dy="46">Informationstechnik ha avvertito</tspan><tspan x="64" dy="46">diversi membri del governo e deputati</tspan><tspan x="64" dy="46">dopo indicazioni relative a possibili</tspan><tspan x="64" dy="46">spyware sugli smartphone, secondo</tspan><tspan x="64" dy="46">Tagesschau e Süddeutsche Zeitung. Il</tspan><tspan x="64" dy="46">caso riguarda direttamente la</tspan><tspan x="64" dy="46">resilienza digitale delle istituzioni</tspan><tspan x="64" dy="46">federali e la protezione delle</tspan><tspan x="64" dy="46">comunicazioni politiche. Restano da</tspan><tspan x="64" dy="46">chiarire la portata dell’eventuale</tspan><tspan x="64" dy="46">compromissione, le persone coinvolte e</tspan><tspan x="64" dy="46">le misure adottate.</tspan></text></svg>