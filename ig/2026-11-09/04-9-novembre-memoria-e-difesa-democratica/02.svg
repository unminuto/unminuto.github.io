<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Deutschlandfunk segnala numerose</tspan><tspan x="64" dy="46">iniziative per ricordare insieme la</tspan><tspan x="64" dy="46">Notte dei cristalli e la caduta del</tspan><tspan x="64" dy="46">Muro; la commissaria federale per l’Est</tspan><tspan x="64" dy="46">Kaiser richiama la difesa dei valori</tspan><tspan x="64" dy="46">democratici. Il governo federale aveva</tspan><tspan x="64" dy="46">inoltre pubblicato nei giorni scorsi</tspan><tspan x="64" dy="46">comunicazioni istituzionali sul ricordo</tspan><tspan x="64" dy="46">dei pogrom di novembre e sul contrasto</tspan><tspan x="64" dy="46">all’antisemitismo. La ricorrenza</tspan><tspan x="64" dy="46">rimette al centro la memoria storica</tspan><tspan x="64" dy="46">come tema pubblico e politico, mentre</tspan><tspan x="64" dy="46">le iniziative della giornata ne</tspan><tspan x="64" dy="46">traducono il significato nel presente.</tspan></text></svg>