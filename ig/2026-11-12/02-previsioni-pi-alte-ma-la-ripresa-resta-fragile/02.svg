<text x="64" y="168" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="2"><tspan x="64" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="64" y="218" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5"><tspan x="64" dy="0">LA NOTIZIA</tspan></text>
<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/11/12/briefing-del-12-novembre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il Consiglio degli esperti economici ha</tspan><tspan x="64" dy="45">rivisto sensibilmente verso l’alto le sue</tspan><tspan x="64" dy="45">previsioni di crescita per il 2026, come</tspan><tspan x="64" dy="45">riferisce Tagesschau ; DW segnala tuttavia</tspan><tspan x="64" dy="45">che debito elevato, produttività debole e</tspan><tspan x="64" dy="45">riforme mancanti continuano a frenare la</tspan><tspan x="64" dy="45">ripresa. Per la Germania la revisione</tspan><tspan x="64" dy="45">migliora il quadro congiunturale, ma non</tspan><tspan x="64" dy="45">elimina i nodi strutturali che pesano su</tspan><tspan x="64" dy="45">investimenti e competitività. Il punto</tspan><tspan x="64" dy="45">aperto è se le misure di bilancio e le</tspan><tspan x="64" dy="45">riforme promesse possano tradurre una</tspan><tspan x="64" dy="45">previsione migliore in una crescita</tspan><tspan x="64" dy="45">durevole.</tspan></text></svg>