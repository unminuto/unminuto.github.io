<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">In visita a Pechino, Frank-Walter</tspan><tspan x="64" dy="46">Steinmeier ha chiesto alla leadership</tspan><tspan x="64" dy="46">cinese di ridurre il forte squilibrio</tspan><tspan x="64" dy="46">commerciale con la Germania. Tagesschau</tspan><tspan x="64" dy="46">quantifica il deficit tedesco del 2025</tspan><tspan x="64" dy="46">in circa 90 miliardi di euro, mentre</tspan><tspan x="64" dy="46">Deutschlandfunk conferma che il tema è</tspan><tspan x="64" dy="46">stato posto direttamente nel colloquio</tspan><tspan x="64" dy="46">con Xi Jinping. Per l’industria tedesca</tspan><tspan x="64" dy="46">il nodo è conciliare l’accesso al</tspan><tspan x="64" dy="46">mercato cinese con una minore</tspan><tspan x="64" dy="46">dipendenza dalle esportazioni di</tspan><tspan x="64" dy="46">Pechino; resta da vedere se il richiamo</tspan><tspan x="64" dy="46">politico produrrà aperture concrete.</tspan></text></svg>