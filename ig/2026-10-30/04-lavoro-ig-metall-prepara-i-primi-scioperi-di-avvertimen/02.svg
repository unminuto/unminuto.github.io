<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">IG Metall annuncia una prima ondata di</tspan><tspan x="64" dy="44">scioperi di avvertimento dalla domenica: il</tspan><tspan x="64" dy="44">sindacato chiede il cinque per cento in più</tspan><tspan x="64" dy="44">per salari e stipendi, riferisce</tspan><tspan x="64" dy="44">Deutschlandfunk . Le associazioni datoriali</tspan><tspan x="64" dy="44">propongono pagamenti una tantum dalla metà</tspan><tspan x="64" dy="44">del prossimo anno e un aumento dell’1,3 per</tspan><tspan x="64" dy="44">cento da luglio 2028; il confronto riguarda</tspan><tspan x="64" dy="44">3,7 milioni di lavoratori. La vertenza mette</tspan><tspan x="64" dy="44">insieme settori automobilistici e fornitori</tspan><tspan x="64" dy="44">in difficoltà con comparti della difesa e</tspan><tspan x="64" dy="44">dell’elettronica in crescita: il punto aperto</tspan><tspan x="64" dy="44">è se si troverà una formula comune prima di</tspan><tspan x="64" dy="44">un’escalation.</tspan></text></svg>