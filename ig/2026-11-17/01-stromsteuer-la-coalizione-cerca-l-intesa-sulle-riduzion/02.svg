<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il Koalitionsausschuss affronta oggi la</tspan><tspan x="64" dy="46">riduzione della Stromsteuer, con</tspan><tspan x="64" dy="46">Friedrich Merz che indica come</tspan><tspan x="64" dy="46">obiettivo un taglio integrale dal 2027.</tspan><tspan x="64" dy="46">Tagesschau, Deutschlandfunk, FAZ e</tspan><tspan x="64" dy="46">Handelsblatt collocano la decisione nel</tspan><tspan x="64" dy="46">confronto su pensioni, bilancio e altre</tspan><tspan x="64" dy="46">misure di alleggerimento. Per famiglie</tspan><tspan x="64" dy="46">e imprese tedesche il nodo è se</tspan><tspan x="64" dy="46">l’accordo troverà coperture finanziarie</tspan><tspan x="64" dy="46">condivise e quali misure resteranno</tspan><tspan x="64" dy="46">fuori dall’intesa.</tspan></text></svg>