<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Germania, Austria, Grecia, Danimarca e</tspan><tspan x="64" dy="45">Paesi Bassi intendono avviare dal 2027 un</tspan><tspan x="64" dy="45">progetto pilota di centro per rimpatri in</tspan><tspan x="64" dy="45">Ruanda destinato a persone con domanda</tspan><tspan x="64" dy="45">d’asilo respinta e senza prospettiva di</tspan><tspan x="64" dy="45">ritorno nel Paese d’origine. DW,</tspan><tspan x="64" dy="45">Tagesschau, Deutschlandfunk e Handelsblatt</tspan><tspan x="64" dy="45">riferiscono che il piano presentato a</tspan><tspan x="64" dy="45">Vienna suscita già critiche politiche e</tspan><tspan x="64" dy="45">interrogativi sul finanziamento. Per</tspan><tspan x="64" dy="45">Berlino è un test concreto della linea</tspan><tspan x="64" dy="45">migratoria del governo; restano aperti la</tspan><tspan x="64" dy="45">base operativa, le garanzie giuridiche e</tspan><tspan x="64" dy="45">la sostenibilità del progetto.</tspan></text></svg>