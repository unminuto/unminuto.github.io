<text x="64" y="168" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="2"><tspan x="64" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="64" y="218" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5"><tspan x="64" dy="0">LA NOTIZIA</tspan></text>
<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/11/15/briefing-del-15-novembre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Deutschlandfunk riferisce che, secondo</tspan><tspan x="64" dy="46">informazioni della SPD, il sostegno</tspan><tspan x="64" dy="46">agli impianti fotovoltaici di piccola</tspan><tspan x="64" dy="46">taglia dovrebbe restare nel quadro</tspan><tspan x="64" dy="46">della legge sulle energie rinnovabili.</tspan><tspan x="64" dy="46">Per famiglie e installatori, il punto</tspan><tspan x="64" dy="46">conta perché gli incentivi condizionano</tspan><tspan x="64" dy="46">i tempi di ritorno degli investimenti e</tspan><tspan x="64" dy="46">la diffusione della generazione</tspan><tspan x="64" dy="46">distribuita. Il nodo aperto è la</tspan><tspan x="64" dy="46">formulazione legislativa definitiva e</tspan><tspan x="64" dy="46">il rapporto con le altre misure</tspan><tspan x="64" dy="46">energetiche della coalizione.</tspan></text></svg>