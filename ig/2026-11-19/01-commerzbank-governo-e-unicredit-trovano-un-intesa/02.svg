<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/11/19/briefing-del-19-novembre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il governo federale e UniCredit hanno</tspan><tspan x="64" dy="46">raggiunto un’intesa sull’operazione</tspan><tspan x="64" dy="46">Commerzbank, secondo Tagesschau ; anche</tspan><tspan x="64" dy="46">Deutschlandfunk, citando Reuters, e la</tspan><tspan x="64" dy="46">FAZ riferiscono di contatti fra Lars</tspan><tspan x="64" dy="46">Klingbeil e l’amministratore delegato</tspan><tspan x="64" dy="46">Andrea Orcel. Il dossier è centrale per</tspan><tspan x="64" dy="46">la Germania perché riguarda il futuro</tspan><tspan x="64" dy="46">di una grande banca tedesca e il ruolo</tspan><tspan x="64" dy="46">del governo nel suo azionariato.</tspan><tspan x="64" dy="46">Restano da chiarire i dettagli</tspan><tspan x="64" dy="46">dell’accordo e le conseguenze per</tspan><tspan x="64" dy="46">struttura proprietaria, personale e</tspan><tspan x="64" dy="46">strategia dell’istituto.</tspan></text></svg>