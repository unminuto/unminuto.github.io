<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il ministro dei Trasporti Patrick</tspan><tspan x="64" dy="46">Schnieder ha definito «interessante»</tspan><tspan x="64" dy="46">l’ipotesi di un Deutschlandticket</tspan><tspan x="64" dy="46">rivolto agli utenti occasionali,</tspan><tspan x="64" dy="46">secondo Deutschlandfunk . Il dibattito</tspan><tspan x="64" dy="46">riguarda il modello tariffario del</tspan><tspan x="64" dy="46">trasporto locale e la sua accessibilità</tspan><tspan x="64" dy="46">anche per chi non usa quotidianamente</tspan><tspan x="64" dy="46">autobus e treni regionali. Resta da</tspan><tspan x="64" dy="46">chiarire se l’idea porterà a una</tspan><tspan x="64" dy="46">proposta concreta, con quali prezzi e</tspan><tspan x="64" dy="46">con quale ripartizione dei costi fra</tspan><tspan x="64" dy="46">Bund e Länder.</tspan></text></svg>