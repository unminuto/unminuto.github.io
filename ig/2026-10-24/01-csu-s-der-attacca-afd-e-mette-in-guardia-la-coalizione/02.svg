<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/10/24/briefing-del-24-ottobre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Al congresso della CSU Markus Söder ha</tspan><tspan x="64" dy="45">indicato la lotta all’AfD come priorità e</tspan><tspan x="64" dy="45">ha avvertito che un fallimento della</tspan><tspan x="64" dy="45">coalizione di governo avrebbe conseguenze</tspan><tspan x="64" dy="45">per la democrazia e per i partiti</tspan><tspan x="64" dy="45">popolari. Tagesschau , Deutschlandfunk ,</tspan><tspan x="64" dy="45">Handelsblatt e FAZ collocano l’intervento</tspan><tspan x="64" dy="45">nel dibattito sul rapporto fra Unione,</tspan><tspan x="64" dy="45">alleati di governo e destra radicale. Per</tspan><tspan x="64" dy="45">Berlino il segnale è rilevante perché la</tspan><tspan x="64" dy="45">CSU governa con la CDU a livello federale;</tspan><tspan x="64" dy="45">resta da vedere se alle parole seguiranno</tspan><tspan x="64" dy="45">posizioni condivise su coalizione e</tspan><tspan x="64" dy="45">candidatura alla presidenza federale.</tspan></text></svg>