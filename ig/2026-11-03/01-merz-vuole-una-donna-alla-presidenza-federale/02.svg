<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Friedrich Merz ha indicato di voler</tspan><tspan x="64" dy="46">vedere per la prima volta una donna</tspan><tspan x="64" dy="46">alla guida della presidenza federale,</tspan><tspan x="64" dy="46">mentre il mandato di Frank-Walter</tspan><tspan x="64" dy="46">Steinmeier avanza verso la scadenza. La</tspan><tspan x="64" dy="46">scelta peserà sul profilo simbolico</tspan><tspan x="64" dy="46">della Repubblica federale e apre una</tspan><tspan x="64" dy="46">fase di confronto tra i partiti su nomi</tspan><tspan x="64" dy="46">e maggioranze. Resta aperto chi verrà</tspan><tspan x="64" dy="46">proposto e se emergerà una candidatura</tspan><tspan x="64" dy="46">condivisa.</tspan></text></svg>