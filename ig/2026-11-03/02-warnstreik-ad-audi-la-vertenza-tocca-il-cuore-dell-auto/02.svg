<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">La Süddeutsche Zeitung segnala uno</tspan><tspan x="64" dy="46">sciopero di avvertimento nello</tspan><tspan x="64" dy="46">stabilimento Audi di Ingolstadt, sullo</tspan><tspan x="64" dy="46">sfondo delle proteste contro i risparmi</tspan><tspan x="64" dy="46">in Germania e della strategia di</tspan><tspan x="64" dy="46">crescita negli Stati Uniti. La</tspan><tspan x="64" dy="46">mobilitazione riguarda uno dei comparti</tspan><tspan x="64" dy="46">più rilevanti per occupazione, export e</tspan><tspan x="64" dy="46">filiere industriali tedesche. Il nodo è</tspan><tspan x="64" dy="46">se le richieste dei lavoratori</tspan><tspan x="64" dy="46">modificheranno i piani aziendali e il</tspan><tspan x="64" dy="46">confronto con IG Metall.</tspan></text></svg>