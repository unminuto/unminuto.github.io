<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">L’amministratore delegato di Audi Gernot</tspan><tspan x="64" dy="44">Döllner ha annunciato a un evento elettorale</tspan><tspan x="64" dy="44">di Donald Trump in Georgia un investimento</tspan><tspan x="64" dy="44">miliardario per uno stabilimento</tspan><tspan x="64" dy="44">statunitense. Handelsblatt riporta le</tspan><tspan x="64" dy="44">critiche della SPD e del ministro digitale</tspan><tspan x="64" dy="44">bavarese, che contestano il contesto politico</tspan><tspan x="64" dy="44">dell’annuncio mentre in Germania si discute</tspan><tspan x="64" dy="44">di posti di lavoro e siti produttivi. Il caso</tspan><tspan x="64" dy="44">mette insieme strategia industriale, tensioni</tspan><tspan x="64" dy="44">commerciali e reputazione del gruppo</tspan><tspan x="64" dy="44">Volkswagen; mancano ancora dettagli</tspan><tspan x="64" dy="44">sull’effetto concreto su occupazione e</tspan><tspan x="64" dy="44">capacità in Germania.</tspan></text></svg>