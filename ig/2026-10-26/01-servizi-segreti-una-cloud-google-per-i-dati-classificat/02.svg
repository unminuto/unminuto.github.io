<text x="64" y="168" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="2"><tspan x="64" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="64" y="218" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5"><tspan x="64" dy="0">LA NOTIZIA</tspan></text>
<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/10/26/briefing-del-26-ottobre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">BND, Bundesamt für Verfassungsschutz e servizio</tspan><tspan x="64" dy="42">di controspionaggio militare intendono creare</tspan><tspan x="64" dy="42">una «ND-Cloud» per scambiare elettronicamente</tspan><tspan x="64" dy="42">informazioni fino al livello «Geheim»; secondo</tspan><tspan x="64" dy="42">l’inchiesta di Tagesschau , la base tecnica</tspan><tspan x="64" dy="42">prevista è Google Distributed Cloud in versione</tspan><tspan x="64" dy="42">isolata dalla rete. I dati dovrebbero restare in</tspan><tspan x="64" dy="42">Germania e Google non dovrebbe potervi accedere,</tspan><tspan x="64" dy="42">ma componenti del progetto sono ancora in attesa</tspan><tspan x="64" dy="42">di autorizzazione BSI e il costo stimato è di</tspan><tspan x="64" dy="42">almeno 500 milioni di euro. Il punto aperto è se</tspan><tspan x="64" dy="42">l’architettura e gli aggiornamenti del fornitore</tspan><tspan x="64" dy="42">statunitense risponderanno davvero all’obiettivo</tspan><tspan x="64" dy="42">tedesco di sovranità digitale.</tspan></text></svg>