<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/10/26/briefing-del-26-ottobre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il governo prepara una nuova categoria</tspan><tspan x="64" dy="45">contrattuale volontaria, il Gebäudetyp E</tspan><tspan x="64" dy="45">(«semplice»), per consentire a committenti</tspan><tspan x="64" dy="45">e progettisti di derogare in modo</tspan><tspan x="64" dy="45">giuridicamente sicuro a standard non</tspan><tspan x="64" dy="45">essenziali, senza intervenire sulla</tspan><tspan x="64" dy="45">sicurezza. Tagesschau riferisce che</tspan><tspan x="64" dy="45">esperti stimano risparmi di costo intorno</tspan><tspan x="64" dy="45">al dieci per cento e che il testo passa</tspan><tspan x="64" dy="45">ora a Länder e associazioni. L’incognita è</tspan><tspan x="64" dy="45">se l’opzione volontaria produrrà davvero</tspan><tspan x="64" dy="45">più abitazioni accessibili oppure resterà</tspan><tspan x="64" dy="45">una nicchia del diritto contrattuale.</tspan></text></svg>