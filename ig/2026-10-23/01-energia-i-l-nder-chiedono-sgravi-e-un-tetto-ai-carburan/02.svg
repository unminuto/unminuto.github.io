<text x="70" y="178" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="2"><tspan x="70" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="70" y="232" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5"><tspan x="70" dy="0">LA NOTIZIA</tspan></text>
<text x="1010" y="232" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1.5"><tspan x="1010" dy="0">02 / 03</tspan></text>
<rect x="70" y="1160" width="940" height="1" fill="#4E3976"/><text x="70" y="1220" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="-.35"><tspan x="70" dy="0">unminuto.news/2026/10/23/briefing-del-23-ottobre/</tspan></text><text x="1010" y="510" text-anchor="end" fill="#F1E8F5" opacity=".82" font-family="Arial, Helvetica, sans-serif" font-size="340" font-weight="900" letter-spacing="-25"><tspan x="1010" dy="0">02</tspan></text>
<text x="70" y="370" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900" letter-spacing="-2"><tspan x="70" dy="0">ENERGIA: I LÄNDER</tspan><tspan x="70" dy="44">CHIEDONO SGRAVI E UN</tspan><tspan x="70" dy="44">TETTO AI CARBURANTI</tspan></text>
<rect x="70" y="500" width="760" height="2" fill="#FF4F87"/>
<text x="70" y="560" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" letter-spacing="-.35"><tspan x="70" dy="0">La Conferenza dei ministri-presidenti chiede</tspan><tspan x="70" dy="39">al governo federale di ridurre la tassa</tspan><tspan x="70" dy="39">sull’elettricità e di limitare i costi dei</tspan><tspan x="70" dy="39">carburanti; la richiesta arriva mentre i</tspan><tspan x="70" dy="39">Länder sostengono che Berlino disponga di</tspan><tspan x="70" dy="39">margini per alleggerire le bollette.</tspan><tspan x="70" dy="39">Tagesschau parla di una domanda di interventi</tspan><tspan x="70" dy="39">rapidi, mentre Deutschlandfunk registra</tspan><tspan x="70" dy="39">l’adesione del ministro-presidente dell’Assia</tspan><tspan x="70" dy="39">Boris Rhein alla riduzione per tutti. Per la</tspan><tspan x="70" dy="39">Germania il nodo è la ripartizione del costo</tspan><tspan x="70" dy="39">fra bilancio federale, famiglie e imprese;</tspan><tspan x="70" dy="39">resta da vedere se il governo accetterà la</tspan><tspan x="70" dy="39">pressione dei Länder e con quali coperture.</tspan></text><rect x="70" y="1080" width="211" height="8" fill="#FF4F87"/><rect x="281" y="1080" width="205" height="8" fill="#7C4DFF"/><rect x="486" y="1080" width="204" height="8" fill="#FFDE02"/></svg>