<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#F4EFEA"/><rect x="0" y="0" width="367" height="16" fill="#FF4F87"/><rect x="367" y="0" width="356" height="16" fill="#7C4DFF"/><rect x="723" y="0" width="357" height="16" fill="#FFDE02"/>
