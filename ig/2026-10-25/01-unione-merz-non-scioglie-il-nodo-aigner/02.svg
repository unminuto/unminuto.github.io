<text x="64" y="168" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="2"><tspan x="64" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="64" y="218" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5"><tspan x="64" dy="0">LA NOTIZIA</tspan></text>
<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/10/25/briefing-del-25-ottobre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Al congresso della CSU Friedrich Merz</tspan><tspan x="64" dy="46">ha chiesto a CDU e CSU maggiore</tspan><tspan x="64" dy="46">compattezza contro gli estremismi, ma</tspan><tspan x="64" dy="46">non ha preso posizione sulla proposta</tspan><tspan x="64" dy="46">bavarese di candidare Ilse Aigner alla</tspan><tspan x="64" dy="46">presidenza federale. Tagesschau ,</tspan><tspan x="64" dy="46">Deutschlandfunk , Handelsblatt e FAZ</tspan><tspan x="64" dy="46">riportano che il saluto ad Aigner è</tspan><tspan x="64" dy="46">stato accolto con entusiasmo, senza</tspan><tspan x="64" dy="46">però risolvere la questione. Per la</tspan><tspan x="64" dy="46">politica federale il punto aperto è se</tspan><tspan x="64" dy="46">CDU e CSU convergeranno su Aigner o</tspan><tspan x="64" dy="46">rivendicheranno candidature diverse.</tspan></text></svg>