<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il Kehlsteinhaus sull’Obersalzberg,</tspan><tspan x="64" dy="46">edificio costruito dal regime nazista e</tspan><tspan x="64" dy="46">oggi meta accessibile al pubblico, è</tspan><tspan x="64" dy="46">stato quasi completamente distrutto da</tspan><tspan x="64" dy="46">un incendio. Tagesschau ,</tspan><tspan x="64" dy="46">Deutschlandfunk , FAZ e Süddeutsche</tspan><tspan x="64" dy="46">Zeitung riportano il sospetto di</tspan><tspan x="64" dy="46">incendio doloso e il fermo di un</tspan><tspan x="64" dy="46">sospettato; le autorità indagano anche</tspan><tspan x="64" dy="46">sul movente. Il ministro dell’Interno</tspan><tspan x="64" dy="46">bavarese Joachim Herrmann ha</tspan><tspan x="64" dy="46">prospettato la ricostruzione, mentre</tspan><tspan x="64" dy="46">danni e iter giudiziario restano da</tspan><tspan x="64" dy="46">definire.</tspan></text></svg>