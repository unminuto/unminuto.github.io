<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Un’inchiesta di Tagesschau e Süddeutsche</tspan><tspan x="64" dy="45">Zeitung riferisce che la controllata DWS</tspan><tspan x="64" dy="45">della Deutsche Bank avrebbe gestito circa</tspan><tspan x="64" dy="45">dodici miliardi di euro senza una</tspan><tspan x="64" dy="45">supervisione antiriciclaggio adeguata. DW</tspan><tspan x="64" dy="45">e Handelsblatt collegano il caso anche</tspan><tspan x="64" dy="45">alle accuse statunitensi relative a dati</tspan><tspan x="64" dy="45">del presidente Donald Trump e al</tspan><tspan x="64" dy="45">contraccolpo per la banca tedesca. La</tspan><tspan x="64" dy="45">rilevanza è nazionale perché riguarda</tspan><tspan x="64" dy="45">controlli di compliance in un gruppo</tspan><tspan x="64" dy="45">finanziario sistemico; restano da chiarire</tspan><tspan x="64" dy="45">responsabilità, conseguenze regolatorie e</tspan><tspan x="64" dy="45">risposta dell’istituto.</tspan></text></svg>