<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il ministro della Difesa Boris</tspan><tspan x="64" dy="46">Pistorius ritiene che il fabbisogno di</tspan><tspan x="64" dy="46">personale possa essere coperto senza</tspan><tspan x="64" dy="46">reintrodurre subito la leva, secondo</tspan><tspan x="64" dy="46">Tagesschau e Deutschlandfunk.</tspan><tspan x="64" dy="46">Deutschlandfunk riferisce anche che la</tspan><tspan x="64" dy="46">Bundeswehr conta 190.000 militari, il</tspan><tspan x="64" dy="46">livello più alto dal 2013; Süddeutsche</tspan><tspan x="64" dy="46">colloca la posizione nel confronto</tspan><tspan x="64" dy="46">politico sulla sicurezza. La questione</tspan><tspan x="64" dy="46">pesa sulla capacità di difesa tedesca e</tspan><tspan x="64" dy="46">sugli impegni europei: resta da</tspan><tspan x="64" dy="46">verificare se reclutamento e riserve</tspan><tspan x="64" dy="46">basteranno nel medio periodo.</tspan></text></svg>