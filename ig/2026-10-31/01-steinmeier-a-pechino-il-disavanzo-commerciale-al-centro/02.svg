<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il presidente federale Frank-Walter</tspan><tspan x="64" dy="46">Steinmeier ha chiesto alla Cina di</tspan><tspan x="64" dy="46">ridurre il forte disavanzo commerciale</tspan><tspan x="64" dy="46">con la Germania durante l&#x27;incontro con</tspan><tspan x="64" dy="46">Xi Jinping a Pechino; ha anche</tspan><tspan x="64" dy="46">richiamato la responsabilità comune</tspan><tspan x="64" dy="46">verso l&#x27;ordine internazionale.</tspan><tspan x="64" dy="46">Tagesschau e Handelsblatt collocano il</tspan><tspan x="64" dy="46">messaggio nel timore tedesco per la</tspan><tspan x="64" dy="46">base industriale e per squilibri negli</tspan><tspan x="64" dy="46">scambi. Resta da vedere se il dialogo</tspan><tspan x="64" dy="46">produrrà impegni concreti su accesso al</tspan><tspan x="64" dy="46">mercato e reciprocità.</tspan></text></svg>