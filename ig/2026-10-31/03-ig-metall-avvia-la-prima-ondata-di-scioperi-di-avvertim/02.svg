<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Deutschlandfunk riferisce che IG Metall</tspan><tspan x="64" dy="46">ha avviato la prima ondata di scioperi</tspan><tspan x="64" dy="46">di avvertimento. Il passaggio porta la</tspan><tspan x="64" dy="46">vertenza nei luoghi di lavoro e può</tspan><tspan x="64" dy="46">incidere su produzione e negoziati in</tspan><tspan x="64" dy="46">comparti industriali centrali per</tspan><tspan x="64" dy="46">l&#x27;economia tedesca. Restano da chiarire</tspan><tspan x="64" dy="46">estensione delle astensioni e margini</tspan><tspan x="64" dy="46">per un accordo tra sindacato e imprese.</tspan></text></svg>