<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Per sabato sono annunciate</tspan><tspan x="64" dy="46">manifestazioni della campagna «Gen Z</tspan><tspan x="64" dy="46">regelt» in più di 30 città tedesche,</tspan><tspan x="64" dy="46">con richieste su istruzione, protezione</tspan><tspan x="64" dy="46">del clima, partecipazione politica e</tspan><tspan x="64" dy="46">costo della vita. Tagesschau descrive</tspan><tspan x="64" dy="46">l&#x27;iniziativa come una mobilitazione di</tspan><tspan x="64" dy="46">giovani che si sentono poco ascoltati;</tspan><tspan x="64" dy="46">Deutschlandfunk e FAZ registrano anche</tspan><tspan x="64" dy="46">il dibattito sulle sue rivendicazioni e</tspan><tspan x="64" dy="46">sulla sua tenuta. Il punto aperto è la</tspan><tspan x="64" dy="46">partecipazione effettiva e la capacità</tspan><tspan x="64" dy="46">della protesta di tradursi in pressione</tspan><tspan x="64" dy="46">politica duratura.</tspan></text></svg>