<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">L&#x27;UE e il Canada hanno annunciato a</tspan><tspan x="64" dy="45">Montréal una «Alleanza per il futuro»,</tspan><tspan x="64" dy="45">pensata per approfondire la cooperazione</tspan><tspan x="64" dy="45">dall&#x27;intelligenza artificiale allo spazio.</tspan><tspan x="64" dy="45">Il governo federale ha pubblicato una</tspan><tspan x="64" dy="45">dichiarazione di Friedrich Merz sul</tspan><tspan x="64" dy="45">vertice, mentre Handelsblatt segnala un</tspan><tspan x="64" dy="45">contrasto politico sul lessico della</tspan><tspan x="64" dy="45">dichiarazione finale. Per Berlino, il</tspan><tspan x="64" dy="45">dossier conta perché lega diversificazione</tspan><tspan x="64" dy="45">commerciale, tecnologia e coordinamento</tspan><tspan x="64" dy="45">europeo; il punto aperto è quanto le</tspan><tspan x="64" dy="45">formule diplomatiche diventeranno progetti</tspan><tspan x="64" dy="45">concreti.</tspan></text></svg>