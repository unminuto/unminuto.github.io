<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Dopo il vertice della “coalizione dei</tspan><tspan x="64" dy="45">volenterosi” a Berlino, il cancelliere</tspan><tspan x="64" dy="45">Friedrich Merz ha chiesto colloqui</tspan><tspan x="64" dy="45">prossimi con la Russia in sede neutrale e</tspan><tspan x="64" dy="45">ha ribadito che l’Europa deve partecipare</tspan><tspan x="64" dy="45">a un accordo di pace, secondo Tagesschau .</tspan><tspan x="64" dy="45">DW, Handelsblatt e Süddeutsche descrivono</tspan><tspan x="64" dy="45">il vertice come una riaffermazione del</tspan><tspan x="64" dy="45">sostegno europeo all’Ucraina, con Berlino</tspan><tspan x="64" dy="45">al centro della cornice diplomatica. Resta</tspan><tspan x="64" dy="45">da vedere se Mosca accetterà un formato</tspan><tspan x="64" dy="45">con Ucraina, Europa e Stati Uniti e quali</tspan><tspan x="64" dy="45">garanzie di sicurezza potranno essere</tspan><tspan x="64" dy="45">concordate.</tspan></text></svg>