<text x="64" y="168" text-anchor="start" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" letter-spacing="2"><tspan x="64" dy="0">GERMANIA, IN BREVE</tspan></text>
<text x="64" y="218" text-anchor="start" fill="#6F6378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5"><tspan x="64" dy="0">LA NOTIZIA</tspan></text>
<text x="1016" y="218" text-anchor="end" fill="#7C4DFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5"><tspan x="1016" dy="0">02 / 03</tspan></text>
<rect x="64" y="962" width="952" height="1" fill="#4E3976"/><text x="64" y="1018" text-anchor="start" fill="#21172F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="-.55"><tspan x="64" dy="0">unminuto.news/2026/11/20/briefing-del-20-novembre/</tspan></text><text x="1016" y="480" text-anchor="end" fill="#F1E8F5" opacity=".75" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="900" letter-spacing="-25"><tspan x="1016" dy="0">02</tspan></text>
<rect x="64" y="285" width="240" height="8" fill="#FF4F87"/>
<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Il ministro della Difesa Boris Pistorius e</tspan><tspan x="64" dy="45">il collega polacco Wladyslaw</tspan><tspan x="64" dy="45">Kosiniak-Kamysz vogliono definire entro le</tspan><tspan x="64" dy="45">consultazioni governative di gennaio una</tspan><tspan x="64" dy="45">tabella di marcia per rendere operativo</tspan><tspan x="64" dy="45">l’accordo difensivo firmato in estate,</tspan><tspan x="64" dy="45">riferisce Tagesschau . Il piano riguarda</tspan><tspan x="64" dy="45">cooperazione militare, industria della</tspan><tspan x="64" dy="45">difesa e protezione del fianco orientale</tspan><tspan x="64" dy="45">della NATO: per la Germania è un dossier</tspan><tspan x="64" dy="45">diretto di sicurezza e capacità</tspan><tspan x="64" dy="45">industriale. Restano da precisare i</tspan><tspan x="64" dy="45">progetti comuni, le scadenze e le risorse</tspan><tspan x="64" dy="45">che i due governi impegneranno.</tspan></text></svg>