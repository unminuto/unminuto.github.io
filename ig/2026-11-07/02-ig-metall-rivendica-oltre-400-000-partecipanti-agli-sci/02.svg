<text x="64" y="365" text-anchor="start" fill="#4E4358" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="-.45"><tspan x="64" dy="0">Handelsblatt riferisce che IG Metall</tspan><tspan x="64" dy="46">conta più di 400.000 partecipanti agli</tspan><tspan x="64" dy="46">scioperi di avvertimento e chiede un</tspan><tspan x="64" dy="46">aumento salariale del 5 per cento. Il</tspan><tspan x="64" dy="46">sindacato prospetta un irrigidimento</tspan><tspan x="64" dy="46">della mobilitazione se le imprese non</tspan><tspan x="64" dy="46">miglioreranno l’offerta prima delle</tspan><tspan x="64" dy="46">trattative di lunedì. La vertenza tocca</tspan><tspan x="64" dy="46">il cuore della manifattura tedesca e</tspan><tspan x="64" dy="46">quindi salari, produzione e catene</tspan><tspan x="64" dy="46">dell’auto; il punto aperto è se il</tspan><tspan x="64" dy="46">negoziato eviterà un’escalation.</tspan></text></svg>